# Dependency updates, tuned for signal over noise: one grouped PR per
# ecosystem per week for minor/patch bumps; majors arrive individually
# because they are the ones that need actual reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
