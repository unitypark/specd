<!-- The specd mark: four interlocking hooks, extracted verbatim from
     apps/web/components/Logo.tsx (the app's own nav mark). Two files because
     GitHub renders README SVGs via <img>, where currentColor cannot inherit —
     the <picture> element in README.md picks per color scheme. -->
<svg width="96" height="96" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="specd">
  <g fill="none" stroke="#0f0f0f" stroke-width="2.9" stroke-linecap="round">
    <path d="M8.48 7.26A8 8 0 1 1 20 16.93"/>
    <path d="M8.48 7.26A8 8 0 1 1 20 16.93" transform="rotate(90 16 16)"/>
    <path d="M8.48 7.26A8 8 0 1 1 20 16.93" transform="rotate(180 16 16)"/>
    <path d="M8.48 7.26A8 8 0 1 1 20 16.93" transform="rotate(270 16 16)"/>
  </g>
</svg>
